<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时字幕</title>
<style>
  :root { --bg: #111418; --panel: #1c2128; --fg: #e6edf3; --accent: #4c8bf5; --err: #f85149; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 24px; background: var(--panel); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2d333b; }
  header h1 { font-size: 18px; margin-right: 8px; }
  #url { flex: 1; min-width: 280px; padding: 10px 14px; font-size: 15px; background: #0d1117; color: var(--fg); border: 1px solid #30363d; border-radius: 6px; }
  #url::placeholder { color: #6e7681; }
  select, button { padding: 10px 16px; font-size: 15px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: var(--fg); cursor: pointer; }
  button#start { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button#stop { background: var(--panel); display: none; }
  #status { width: 100%; color: #8b949e; font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 16px; overflow: hidden; }
  #current { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(28px, 4vw, 44px); line-height: 1.5; font-weight: 600; letter-spacing: 1px; background: var(--panel); border-radius: 12px; padding: 24px; }
  #history { height: 26%; background: var(--panel); border-radius: 12px; padding: 12px 16px; overflow-y: auto; font-size: 15px; color: #9da7b3; }
  #history div { padding: 3px 0; }
  #history div span { color: #6e7681; margin-right: 8px; font-size: 12px; }
  .err { color: var(--err) !important; }
</style>
</head>
<body>
<header>
  <h1>🎙 实时字幕</h1>
  <input id="url" placeholder="输入流地址 / 视频链接 / 本地文件路径，如 https://.../index.m3u8 或 B站视频链接">
  <select id="engine">
    <option value="faster-whisper">本地 faster-whisper</option>
    <option value="aliyun-funasr" disabled>阿里云 FunASR API（待接入）</option>
  </select>
  <input type="file" id="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.mp4,.mkv,.flac" hidden>
  <button id="uploadBtn" title="上传本地音频/视频文件">📁 上传文件</button>
  <button id="start">开始</button>
  <button id="stop">停止</button>
  <div id="status">就绪</div>
</header>
<main>
  <div id="current">输入上方地址，点击「开始」生成实时字幕</div>
  <div id="history"></div>
</main>
<script>
  const urlEl = document.getElementById('url');
  const engineEl = document.getElementById('engine');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const statusEl = document.getElementById('status');
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');
  const fileEl = document.getElementById('file');
  const uploadBtn = document.getElementById('uploadBtn');
  let ws = null;

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!isErr);
  }

  function appendHistory(beg, end, text) {
    const div = document.createElement('div');
    const time = document.createElement('span');
    time.textContent = `${beg.toFixed(1)}s-${end.toFixed(1)}s`;
    div.appendChild(time);
    div.appendChild(document.createTextNode(text));
    historyEl.appendChild(div);
    while (historyEl.children.length > 200) historyEl.removeChild(historyEl.firstChild);
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function connect() {
    const url = urlEl.value.trim();
    if (!url) { setStatus('请输入流地址', true); return; }
    const params = new URLSearchParams({ url, engine: engineEl.value });
    ws = new WebSocket(`ws://${location.host}/ws?${params}`);
    startBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    currentEl.classList.remove('err');
    setStatus('连接中…');

    ws.onopen = () => setStatus('已连接，引擎加载中…');
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'subtitle') {
        currentEl.textContent = msg.text;
        appendHistory(msg.beg, msg.end, msg.text);
      } else if (msg.type === 'status') {
        setStatus(msg.message);
      } else if (msg.type === 'error') {
        currentEl.textContent = '⚠ ' + msg.message;
        currentEl.classList.add('err');
        setStatus('出错', true);
      } else if (msg.type === 'end') {
        setStatus('播放结束');
        ws.close();
      }
    };
    ws.onerror = () => setStatus('连接失败', true);
    ws.onclose = () => {
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    };
  }

  startBtn.onclick = connect;
  stopBtn.onclick = () => { if (ws) ws.close(); setStatus('已停止'); };
  uploadBtn.onclick = () => fileEl.click();
  fileEl.addEventListener('change', async () => {
    const f = fileEl.files[0];
    if (!f) { setStatus('未选择文件', true); return; }
    setStatus(`上传 ${f.name}…`);
    const fd = new FormData();
    fd.append('file', f);
    try {
      const resp = await fetch('/upload', { method: 'POST', body: fd });
      const data = await resp.json();
      if (resp.ok && data.path) {
        urlEl.value = data.path;
        setStatus(`已上传 ${data.name}，开始识别`);
        connect();
      } else {
        setStatus('上传失败: ' + (data.detail || resp.status), true);
      }
    } catch (e) {
      setStatus('上传失败: ' + e, true);
    }
    fileEl.value = '';
  });
  urlEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
