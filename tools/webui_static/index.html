<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时字幕</title>
<style>
  :root { --bg: #111418; --panel: #1c2128; --fg: #e6edf3; --accent: #4c8bf5; --err: #f85149; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 24px; background: var(--panel); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2d333b; }
  header h1 { font-size: 17px; margin-right: 6px; }
  #url { flex: 1; min-width: 260px; padding: 9px 12px; font-size: 14px; background: #0d1117; color: var(--fg); border: 1px solid #30363d; border-radius: 6px; }
  #url::placeholder { color: #6e7681; }
  select, button { padding: 9px 14px; font-size: 14px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: var(--fg); cursor: pointer; }
  button#start { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button#stop { background: var(--panel); display: none; }
  #status { width: 100%; color: #8b949e; font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px 24px; gap: 12px; min-height: 0; }
  #playerWrap { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 12px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #current { position: absolute; left: 0; right: 0; bottom: 12%; padding: 10px 32px; text-align: center;
    font-size: clamp(26px, 3.4vw, 38px); line-height: 1.4; font-weight: 600; letter-spacing: 1px;
    color: #fff; text-shadow: 2px 2px 4px #000, 0 0 12px #000; pointer-events: none;
    display: block; white-space: normal; overflow: visible; }
  #history { height: 18%; background: var(--panel); border-radius: 10px; padding: 10px 14px; overflow-y: auto; font-size: 14px; color: #9da7b3; }
  #history div { padding: 2px 0; }
  #history div span { color: #6e7681; margin-right: 8px; font-size: 12px; }
  #logPanel { display: flex; flex-direction: column; gap: 8px; }
  /* hidden 属性必须生效：作者 CSS 的 display:flex 会覆盖 UA 的 [hidden]{display:none}，
     需显式声明，否则面板常驻显示、日志按钮失去作用 */
  #logPanel[hidden] { display: none; }
  /* 字幕样式面板（ticket-18）：header 内整行；hidden 同日志面板需显式 display:none */
  #stylePanel { width: 100%; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 4px 0 2px; }
  #stylePanel[hidden] { display: none; }
  #stylePanel label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9da7b3; }
  #stylePanel input[type="range"] { width: 150px; accent-color: var(--accent); }
  #stylePanel .val { min-width: 46px; color: var(--fg); font-variant-numeric: tabular-nums; }
  #styleReset { padding: 5px 12px; font-size: 13px; }
  /* 直播频道面板（ticket-19）：m3u 频道列表 + 连通性检测标注 */
  #chPanel { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 2px; }
  #chPanel[hidden] { display: none; }
  .ch-head { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #9da7b3; }
  #chProbeBtn { padding: 5px 12px; font-size: 13px; }
  #chList { max-height: 300px; overflow-y: auto; border: 1px solid #30363d; border-radius: 8px; background: #0d1117; }
  .ch-group { padding: 6px 10px 2px; font-size: 12px; color: #6e7681; font-weight: 600; }
  .ch-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  .ch-row:hover { background: #21262d; }
  .ch-row .ch-status { min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  .ch-row.ok .ch-status { color: #3fb950; }
  .ch-row.fail .ch-status { color: var(--err); }
  .ch-row .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-row button { padding: 2px 8px; font-size: 12px; }
  .ch-row.active { background: #1f3d5f; }
  #logText { width: 100%; height: 140px; background: #0d1117; color: #9da7b3; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 12px; font-family: monospace; font-size: 12px; resize: vertical; }
  .err { color: var(--err) !important; }
  video::-webkit-media-controls { opacity: 0.6; }
</style>
</head>
<body>
<header>
  <h1>🎙 实时字幕</h1>
  <input id="url" placeholder="输入流地址 / 视频链接 / 本地文件路径，如 B站链接 或 /path/to/video.mp4">
  <select id="engine">
    <option value="faster-whisper">本地 faster-whisper</option>
    <option value="aliyun-funasr">阿里云 FunASR API（推荐）</option>
    <option value="funasr-gguf">FunASR Vulkan（文件模式）</option>
    <option value="demo">演示字幕（无识别，仅验证链路）</option>
  </select>
  <select id="silence" title="断句灵敏度：语音后静音多久判定一句结束（越小切句越频繁，仅 API 引擎生效）">
    <option value="200">断句：极灵敏 200ms</option>
    <option value="400" selected>断句：灵敏 400ms</option>
    <option value="800">断句：标准 800ms</option>
    <option value="1300">断句：宽松 1300ms（服务端默认）</option>
  </select>
  <select id="winLen" title="字幕窗口：窗口内音频内容完整显示，窗口到点整体切换或消失（1-4s）">
    <option value="1">窗口 1s</option>
    <option value="2" selected>窗口 2s</option>
    <option value="3">窗口 3s</option>
    <option value="4">窗口 4s</option>
  </select>
  <input type="file" id="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.mp4,.mkv,.flac" hidden>
  <button id="uploadBtn" title="上传本地音频/视频文件">📁 上传文件</button>
  <button id="start">开始</button>
  <button id="stop">停止</button>
  <button id="subToggle" title="开关中间字幕显示">🎬 字幕：开</button>
  <button id="logBtn" title="查看/复制会话日志，便于反馈问题">📋 日志</button>
  <button id="styleBtn" title="实时调整叠加字幕的字体、大小、位置（自动记住）">🎨 字幕样式</button>
  <button id="chBtn" title="加载 m3u 频道列表并选台播放（先在输入框粘贴 .m3u 地址）">📺 频道</button>
  <div id="stylePanel" hidden>
    <label>字号 <input type="range" id="sizeRange" min="16" max="64" step="1" value="30"><span class="val" id="sizeVal">30px</span></label>
    <label>位置 <input type="range" id="posRange" min="0" max="30" step="1" value="12"><span class="val" id="posVal">12%</span></label>
    <label>字体
      <select id="fontSel">
        <option value="default">系统默认</option>
        <option value="heiti">黑体</option>
        <option value="songti">宋体</option>
        <option value="mono">等宽</option>
        <option value="kaiti">楷体</option>
      </select>
    </label>
    <button id="styleReset" title="恢复默认：字号 30px / 位置 12% / 字体系统默认">重置默认</button>
  </div>
  <div id="chPanel" hidden>
    <div class="ch-head">
      <span id="chInfo">未加载频道列表</span>
      <button id="chProbeBtn" title="批量检测所有频道的连通性与延迟（手动触发，并发 20，逐条显示）">🔍 批量检测</button>
    </div>
    <div id="chList"></div>
  </div>
  <div id="status">就绪</div>
</header>
<main>
  <div id="playerWrap">
    <video id="player" controls muted></video>
    <audio id="audioEl" preload="auto"></audio>
    <div id="current">输入地址后点「开始」，边看视频边出字幕</div>
  </div>
  <div id="history"></div>
  <div id="logPanel" hidden>
    <textarea id="logText" readonly spellcheck="false"
      placeholder="会话日志：connect/play/pause/seek/字幕/状态/错误…"></textarea>
    <button id="copyLogBtn" style="align-self: flex-end;">📋 复制日志</button>
  </div>
</main>
<script src="hls.min.js"></script>
<script>
  const urlEl = document.getElementById('url');
  const engineEl = document.getElementById('engine');
  const silenceEl = document.getElementById('silence');
  const winLenEl = document.getElementById('winLen');
  const subToggleBtn = document.getElementById('subToggle');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const statusEl = document.getElementById('status');
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');
  const fileEl = document.getElementById('file');
  const uploadBtn = document.getElementById('uploadBtn');
  const player = document.getElementById('player');
  const audioEl = document.getElementById('audioEl');
  let ws = null;
  let hlsPlayer = null;  // hls.js 实例（HLS 直播，ticket-19）
  let subs = [];        // [{beg, end, text, words}] 句子列表（partial 累计，同句原地更新）
  let historyItems = []; // 与 subs 对应的 history DOM 元素
  let playStarted = false; // 是否已触发视频播放（等字幕就绪）
  let holdingForSync = false; // 字幕未就绪时拦截手动播放产生的 pause，不冻结后端
  let seekPending = false; // seek 后清空当前句显示，等新数据（ADR-0001）
  let aligningInitialPlayback = false;
  let subEnabled = true; // 中间字幕显示开关（ticket-13）
  let displayedBlock = null; // 当前显示块 {w0, text}——窗口起点快照冻结，块内零变化

  // 会话日志：环形缓冲（500 条），供用户一键复制反馈问题（ticket-16 full log）
  const logBtn = document.getElementById('logBtn');
  const logPanel = document.getElementById('logPanel');
  const logText = document.getElementById('logText');
  const copyLogBtn = document.getElementById('copyLogBtn');
  const logBuffer = [];
  function logEvent(type, detail) {
    const ts = new Date().toISOString().slice(11, 23);
    logBuffer.push(`[${ts}] ${type}: ${detail}`);
    if (logBuffer.length > 500) logBuffer.shift();
    if (!logPanel.hidden) logText.value = logBuffer.join('\n');
  }
  logBtn.onclick = () => {
    logPanel.hidden = !logPanel.hidden;
    if (!logPanel.hidden) logText.value = logBuffer.join('\n');
  };
  copyLogBtn.onclick = () => {
    const text = logText.value || logBuffer.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    } else {
      logText.select();
      document.execCommand('copy');
    }
    setStatus('日志已复制');
  };

  // 字幕开关（ticket-13）：同日志按钮，可关可开，默认开
  subToggleBtn.onclick = () => {
    subEnabled = !subEnabled;
    subToggleBtn.textContent = subEnabled ? '🎬 字幕：开' : '🎬 字幕：关';
    if (!subEnabled) currentEl.textContent = '';
    logEvent('sub_toggle', subEnabled ? '开' : '关');
  };

  // 字幕样式：字体/大小/位置实时调整（ticket-18，纯前端 + localStorage）
  const styleBtn = document.getElementById('styleBtn');
  const stylePanel = document.getElementById('stylePanel');
  const sizeRange = document.getElementById('sizeRange');
  const sizeVal = document.getElementById('sizeVal');
  const posRange = document.getElementById('posRange');
  const posVal = document.getElementById('posVal');
  const fontSel = document.getElementById('fontSel');
  const styleReset = document.getElementById('styleReset');
  const STYLE_KEY = 'subtitleStyle';
  const STYLE_DEFAULTS = { size: 30, pos: 12, font: 'default' };
  // 字体预设按本机已装中文字体（fc-list :lang=zh）定；楷体本机未装，走回退链
  const FONTS = {
    default: null,  // 系统默认：继承 body 字体
    heiti: '"Noto Sans CJK SC", "Microsoft YaHei", sans-serif',
    songti: '"Noto Serif CJK SC", "SimSun", serif',
    mono: '"Noto Sans Mono CJK SC", monospace',
    kaiti: '"KaiTi", "STKaiti", "AR PL UKai CN", serif',
  };
  function loadStyle() {
    let s = { ...STYLE_DEFAULTS };
    try {
      const raw = localStorage.getItem(STYLE_KEY);
      if (raw) s = { ...s, ...JSON.parse(raw) };
    } catch (e) { /* 损坏值回默认 */ }
    if (!Object.prototype.hasOwnProperty.call(FONTS, s.font)) s.font = STYLE_DEFAULTS.font;
    s.size = Math.min(64, Math.max(16, Number(s.size) || STYLE_DEFAULTS.size));
    s.pos = Math.min(30, Math.max(0, Number(s.pos) || STYLE_DEFAULTS.pos));
    return s;
  }
  function saveStyle() {
    try { localStorage.setItem(STYLE_KEY, JSON.stringify(styleState)); } catch (e) { /* 隐私模式等 */ }
  }
  let styleState = loadStyle();
  function applyStyle() {
    const s = styleState;
    currentEl.style.fontSize = `${s.size}px`;
    currentEl.style.bottom = `${s.pos}%`;
    if (FONTS[s.font]) currentEl.style.fontFamily = FONTS[s.font];
    else currentEl.style.removeProperty('font-family');
    sizeRange.value = s.size;
    sizeVal.textContent = `${s.size}px`;
    posRange.value = s.pos;
    posVal.textContent = `${s.pos}%`;
    fontSel.value = s.font;
  }
  styleBtn.onclick = () => {
    stylePanel.hidden = !stylePanel.hidden;
    logEvent('style_panel', stylePanel.hidden ? '收起' : '展开');
  };
  // input 事件：拖动中即时生效（实时调整）；change 事件：下拉选择生效
  sizeRange.oninput = () => { styleState.size = parseInt(sizeRange.value, 10); applyStyle(); saveStyle(); };
  posRange.oninput = () => { styleState.pos = parseInt(posRange.value, 10); applyStyle(); saveStyle(); };
  fontSel.onchange = () => { styleState.font = fontSel.value; applyStyle(); saveStyle(); };
  styleReset.onclick = () => {
    styleState = { ...STYLE_DEFAULTS };
    applyStyle();
    saveStyle();
    logEvent('style_reset', '字号30px 位置12% 字体系统默认');
  };
  applyStyle();  // 页面加载即固定应用（覆盖 clamp 响应式），含 localStorage 恢复

  // 直播频道（ticket-19）：m3u 列表解析 + 连通性检测 + 选台播放
  const chBtn = document.getElementById('chBtn');
  const chPanel = document.getElementById('chPanel');
  const chInfo = document.getElementById('chInfo');
  const chProbeBtn = document.getElementById('chProbeBtn');
  const chList = document.getElementById('chList');
  let channels = [];       // [{group, name, url}]
  let chRows = new Map();  // url -> {row, status}

  async function loadChannels(m3uUrl) {
    setStatus('加载频道列表…');
    logEvent('channels_load', m3uUrl.slice(0, 100));
    try {
      const resp = await fetch('/channels?url=' + encodeURIComponent(m3uUrl));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      channels = await resp.json();
    } catch (e) {
      setStatus('频道列表加载失败: ' + e, true);
      return;
    }
    if (!channels.length) { setStatus('频道列表为空（源可能失效）', true); return; }
    renderChannels();
    chPanel.hidden = false;
    setStatus(`频道列表 ${channels.length} 个，点击频道开始观看`);
  }

  function renderChannels() {
    chList.innerHTML = '';
    chRows = new Map();
    const groups = new Map();
    for (const ch of channels) {
      const g = ch.group || '未分组';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(ch);
    }
    for (const [g, list] of groups) {
      const gh = document.createElement('div');
      gh.className = 'ch-group';
      gh.textContent = `${g}（${list.length}）`;
      chList.appendChild(gh);
      for (const ch of list) {
        const row = document.createElement('div');
        row.className = 'ch-row';
        const status = document.createElement('span');
        status.className = 'ch-status';
        const name = document.createElement('span');
        name.className = 'ch-name';
        name.textContent = ch.name;
        name.title = ch.url;
        const btn = document.createElement('button');
        btn.textContent = '🔍';
        btn.title = '检测该频道连通性与延迟';
        btn.onclick = (ev) => { ev.stopPropagation(); probeChannel(ch.url); };
        row.appendChild(status);
        row.appendChild(name);
        row.appendChild(btn);
        row.onclick = () => {
          urlEl.value = ch.url;
          for (const [, r] of chRows) r.row.classList.remove('active');
          row.classList.add('active');
          connect(ch.url);
          logEvent('channel_pick', ch.name);
        };
        chList.appendChild(row);
        chRows.set(ch.url, { row, status });
      }
    }
  }

  async function probeChannel(url) {
    const cell = chRows.get(url);
    if (cell) { cell.row.classList.remove('ok', 'fail'); cell.status.textContent = '检测中…'; }
    try {
      const resp = await fetch('/probe?url=' + encodeURIComponent(url));
      const data = await resp.json();
      if (cell) {
        cell.row.classList.toggle('ok', !!data.ok);
        cell.row.classList.toggle('fail', !data.ok);
        // 带宽是能否流畅播的关键（1080p IPTV 码率 ~1.1MB/s），与延迟并列展示
        cell.status.textContent = data.ok
          ? `✅ ${data.latency_ms}ms·${data.mbps}MB/s`
          : '❌ 失效';
      }
      return data;
    } catch (e) {
      if (cell) { cell.row.classList.add('fail'); cell.status.textContent = '❌ 检测失败'; }
      return { ok: false };
    }
  }

  // 批量检测（ticket-19）：手动触发，并发 20，逐条异步更新（测完一个立即显示）
  chProbeBtn.onclick = () => {
    if (!channels.length) return;
    chProbeBtn.disabled = true;
    const total = channels.length;
    let i = 0, done = 0;
    chInfo.textContent = `批量检测 0/${total}`;
    async function run() {
      while (true) {
        const idx = i++;
        if (idx >= total) break;
        await probeChannel(channels[idx].url);
        done++;
        chInfo.textContent = `批量检测 ${done}/${total}`;
      }
      if (done >= total) { chInfo.textContent = `批量检测完成 ${total}/${total}`; chProbeBtn.disabled = false; }
    }
    for (let k = 0; k < Math.min(20, total); k++) run();
  };
  chBtn.onclick = () => {
    if (!chPanel.hidden) { chPanel.hidden = true; return; }
    const u = urlEl.value.trim();
    if (!/\.m3u($|\?)/i.test(u)) { setStatus('请先在输入框粘贴 .m3u 频道列表地址', true); return; }
    loadChannels(u);
  };

  // 播放卡顿看门狗（ticket-19 复验）：IPTV 源带宽不足或 TS 损坏时视频无声卡死
  // （无 error 事件，t 冻结不动）——t 停止前进 20s 即判定源不可播并提示换源。
  // 注意不能用 t>0 判"在播"：hls.js 会把位置 seek 到直播边缘（t 可能直接是 39）。
  let stallTimer = null;
  function stallWatchdog() {
    if (stallTimer) clearInterval(stallTimer);
    let lastT = player.currentTime;
    let lastChange = Date.now();
    stallTimer = setInterval(() => {
      if (player.paused) { lastT = player.currentTime; return; }  // 用户暂停不算卡
      const t = player.currentTime;
      if (Math.abs(t - lastT) > 0.1) { lastT = t; lastChange = Date.now(); return; }
      if (Date.now() - lastChange > 20000) {
        clearInterval(stallTimer);
        logEvent('video_stall', `播放卡顿：${lastT.toFixed(1)}s 处冻结 20s`);
        currentEl.textContent = '⚠ 该源播放卡顿（带宽不足或源损坏），请点 🔍 检测换一个快源';
        currentEl.classList.add('err');
        setStatus('播放卡顿：请换源', true);
      }
    }, 2000);
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!isErr);
    logEvent(isErr ? 'error' : 'status', msg);
  }

  function appendHistory(beg, end, text) {
    const div = document.createElement('div');
    const time = document.createElement('span');
    time.textContent = `${beg.toFixed(1)}s-${end.toFixed(1)}s`;
    div.appendChild(time);
    div.appendChild(document.createTextNode(text));
    historyEl.appendChild(div);
    historyItems.push(div);
    while (historyItems.length > 200) historyEl.removeChild(historyItems.shift());
    historyEl.scrollTop = historyEl.scrollHeight;
    return div;
  }

  function updateHistory(div, msg) {
    if (!div) return;
    div.childNodes[0].textContent = `${msg.beg.toFixed(1)}s-${msg.end.toFixed(1)}s`;
    div.childNodes[1].textContent = msg.text;
  }

  function syncSubtitle() {
    const t = player.currentTime;
    // 出错态：保留错误提示，不被占位符/字幕覆盖
    if (currentEl.classList.contains('err')) return;
    // 字幕开关（ticket-13）：关闭则中间字幕不显示
    if (!subEnabled) {
      currentEl.textContent = '';
      return;
    }
    // seek 后清空显示，等新数据（防止定格旧句误导）
    if (seekPending) {
      currentEl.textContent = '⏳ 跳转中，字幕将随转写跟进…';
      return;
    }
    // 视频未开始播放时不显示字幕（避免"字幕提前"的错觉）
    if (player.paused && t < 0.5) {
      currentEl.textContent = '⏳ 字幕准备中，就绪后自动播放（无需点击）';
      return;
    }
    // 固定窗口分块（ADR-0002）：窗口与完整识别句相交时显示整句，不按字级时间戳
    // 截断成短语片段。收到 ASR 修订时重算当前窗口，让完整句子及时替换旧文本。
    const D = parseFloat(winLenEl.value) || 2;
    const w0 = Math.floor(t / D) * D;
    if (!displayedBlock || displayedBlock.w0 !== w0) {
      const candidates = subs.map(s => {
        const wordStarts = (s.words || []).map(w => w[0]);
        const wordEnds = (s.words || []).map(w => w[1] == null ? w[0] : w[1]);
        return {
          ...s,
          captionBeg: wordStarts.length ? Math.min(s.beg, ...wordStarts) : s.beg,
          captionEnd: wordEnds.length ? Math.max(s.end, ...wordEnds) : s.end,
        };
      }).filter(s => s.captionBeg != null && s.captionEnd != null
        && s.captionBeg < w0 + D && s.captionEnd > w0 && s.text.trim())
        .sort((a, b) => a.captionBeg - b.captionBeg);
      const groups = [];
      for (const caption of candidates) {
        let group = groups.find(g => Math.abs(g.beg - caption.captionBeg) < 0.75
          && g.end > caption.captionBeg && caption.captionEnd > g.beg);
        if (!group) {
          group = { beg: caption.captionBeg, end: caption.captionEnd, text: caption.text.trim() };
          groups.push(group);
        } else {
          group.end = Math.max(group.end, caption.captionEnd);
          if (caption.text.trim().length > group.text.length) group.text = caption.text.trim();
        }
      }
      displayedBlock = { w0, text: groups.map(g => g.text).join(' ') };
    }
    currentEl.textContent = displayedBlock.text;
    return;
  }

  // 字幕处理：partial 实时数据（同句原地更新），显示由 2s 定时器快照（整块替换）
  let uiPaused = false;  // 前端暂停标志：暂停期间忽略新数据（后端同时停止解析）
  function sharedWordRatio(a, b) {
    if (!a || !a.length || !b || !b.length) return 0;
    let shared = 0;
    for (const left of a) {
      if (b.some(right => left[2] === right[2] && Math.abs(left[0] - right[0]) < 0.25)) shared++;
    }
    return shared / Math.min(a.length, b.length);
  }

  function sameSubtitle(a, b) {
    // ASR partial revisions may shift their estimated sentence start by several
    // hundred milliseconds, especially when corrected words change alignment.
    const beginDrift = Math.abs(a.beg - b.beg);
    const overlap = Math.max(0, Math.min(a.end, b.end) - Math.max(a.beg, b.beg));
    const shorterDuration = Math.min(a.end - a.beg, b.end - b.beg);
    if (beginDrift < 1.0 && shorterDuration > 0
        && overlap / shorterDuration >= 0.5) return true;
    if (sharedWordRatio(a.words, b.words) >= 0.5) return true;
    return false;
  }

  function onSubtitle(msg) {
    if (uiPaused) return;  // 暂停：丢弃在途 partial，恢复后重新同步
    seekPending = false;  // 新数据到达，解除 seek 等待
    if (!msg.text) return;
    let idx = subs.findIndex(s => sameSubtitle(s, msg));
    if (idx >= 0) {
      // Partial may move its begin timestamp slightly; matching shared word times
      // keeps that revision in one history row and prevents duplicate overlay text.
      const matched = subs[idx];
      matched.beg = msg.beg;
      matched.end = msg.end;
      matched.text = msg.text;
      if (msg.words) matched.words = msg.words;
      updateHistory(matched.historyItem, msg);
      for (let i = subs.length - 1; i >= 0; i--) {
        if (i !== idx && sameSubtitle(matched, subs[i])) {
          const duplicateRow = subs[i].historyItem;
          subs.splice(i, 1);
          duplicateRow?.remove();
          historyItems = historyItems.filter(item => item !== duplicateRow);
          if (i < idx) idx--;
        }
      }
    } else {
      // 新句：加入列表与历史
      const historyItem = appendHistory(msg.beg, msg.end, msg.text);
      subs.push({ beg: msg.beg, end: msg.end, text: msg.text, words: msg.words || null, historyItem });
      logEvent('sub', `beg=${msg.beg.toFixed(1)} ${msg.text.slice(0, 24)}`);
    }
    displayedBlock = null;
    syncSubtitle();
  }

  function connect(forceUrl) {
    // forceUrl 可能是 onclick 传入的 Event 对象（startBtn.onclick = connect），只认字符串
    const url = ((typeof forceUrl === 'string' && forceUrl) || urlEl.value).trim();
    if (!url) { setStatus('请输入流地址', true); return; }
    if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }
    // m3u 频道列表（ticket-19）：识别为列表则加载频道面板，不直接拉流
    if (/\.m3u($|\?)/i.test(url)) { loadChannels(url); return; }
    logEvent('connect', url.slice(0, 120));
    // 旧会话清理：不关旧 WS 则旧 worker 继续推流串字幕；
    // uiPaused 不重置则新会话字幕全被丢弃 → 自动播放死锁、画面卡在上一视频末帧
    if (ws) { ws.onmessage = null; ws.onclose = null; ws.close(); }
    subs = [];
    historyItems = [];
    historyEl.innerHTML = '';
    playStarted = false;
    holdingForSync = false;
    uiPaused = false;
    seekPending = false;
    displayedBlock = null;
    currentEl.classList.remove('err');
    currentEl.textContent = '⏳ 字幕准备中，就绪后自动播放（无需点击）';
    lastBlockEnd = -1;
    const params = new URLSearchParams({ url, engine: engineEl.value, silence: silenceEl.value, win: winLenEl.value });
    ws = new WebSocket(`ws://${location.host}/ws?${params}`);
    startBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    currentEl.classList.remove('err');
    setStatus('连接中…');
    // 画面走 video，声音按源类型分流（ticket-19）：HLS 音视频混在 TS 流里，
    // 视频元素直接出声；B站 DASH / 本地文件走隐藏 audio（音视频分离）。
    // 不立即播放：等首条字幕到达后再播（源延迟 1.5s 补偿，字幕从一开始就同步）
    // 切换前必须清理旧 audioEl：若旧 src 加载失败（B站防盗链），浏览器会锁定 error 状态，
    // 仅赋新 src 不会触发重新加载 → 音频残留或无声。pause→清空→load→赋新 src 强制重置。
    const isHls = /\.m3u8/i.test(url);
    audioEl.pause();
    audioEl.removeAttribute('src');
    audioEl.load();
    if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
      // HLS（ticket-19）：hls.js 播放——Chrome 原生 HLS 只支持 fMP4 分片，
      // IPTV 直播源几乎全是 MPEG-TS，需 hls.js 转封装成 fMP4 供 MSE 播放；
      // 播放列表/分片均走本地代理（同源，无 CORS/防盗链问题）。
      if (hlsPlayer) hlsPlayer.destroy();
      player.removeAttribute('src');
      player.load();
      // 慢源适配（2026-08-09 实测）：IPTV 分片常达 5MB+ 且上游带宽 ~1MB/s，
      // 默认预缓冲 3 片（≈16s）期间分片逐个过期 → 启动极慢或直接卡死。
      // 只缓冲 1 片尽快开播 + 贴近直播边缘 + 加大重试容错。
      hlsPlayer = new Hls({
        liveSyncDurationCount: 1,
        maxBufferLength: 10,
        backBufferLength: 0,
        fragLoadingConcurrency: 1,  // 串行拉分片：不与他人（ASR 拉流）抢慢源带宽
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 6,
        levelLoadingMaxRetry: 6,
      });
      hlsPlayer.loadSource(`/video?url=${encodeURIComponent(url)}`);
      hlsPlayer.attachMedia(player);
      hlsPlayer.on(Hls.Events.ERROR, (_evt, data) => {
        if (!data.fatal) return;
        logEvent('hls_error', `${data.type}/${data.details}`);
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && hlsPlayer) {
          hlsPlayer.startLoad();  // 网络抖动自动重连
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && hlsPlayer) {
          hlsPlayer.recoverMediaError();
        } else {
          currentEl.textContent = '⚠ 直播流播放失败（源可能失效，换个频道）';
          currentEl.classList.add('err');
        }
      });
      player.muted = false;  // HLS 直播：视频元素自带音轨
    } else {
      player.src = `/video?url=${encodeURIComponent(url)}`;
      player.load();  // 换源显式 load，避免旧源失败状态残留导致黑屏（ticket-11）
      if (isHls) {
        player.muted = false;  // 原生 HLS（fMP4 等）：视频元素自带音轨
      } else {
        player.muted = true;
        audioEl.src = `/audio?url=${encodeURIComponent(url)}`;
      }
    }

    ws.onopen = () => { logEvent('ws_open', ''); setStatus('已连接，引擎加载中…'); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'subtitle') {
        onSubtitle(msg);
      } else if (msg.type === 'ready') {
        // 播放就绪（ticket-15）：后端已处理满一个窗口的音频，字幕第一块将完整——
        // 此时才开播（+1.5s 让转写先跟上），不再由首条字幕触发。
        // HLS 音频从 live_sync_position 起解，视频也 seek 到同一 ASR 时间点，
        // 避免 HLS.js 从直播边缘起播、PyAV 却从更早分片起解造成字幕落后。
        if (hlsPlayer && Number.isFinite(msg.start_at)) {
          aligningInitialPlayback = true;
          try { player.currentTime = Math.max(0, msg.start_at); }
          catch (e) { logEvent('sync_seek_error', String(e)); }
          setTimeout(() => { aligningInitialPlayback = false; }, 3000);
          logEvent('sync_start', `t=${Number(msg.start_at).toFixed(1)}s`);
        }
        playStarted = true;
        holdingForSync = false;
        logEvent('ready', `win=${msg.win}s，开始播放`);
        setTimeout(() => { player.play().catch(() => {}); }, 1500);
        // 播放卡顿看门狗（ticket-19 复验）：IPTV 源带宽不足或 TS 时间轴损坏时，
        // 视频可能长时间 waiting/不前进却无 error 事件（无声卡死）——2s 轮询，
        // 就绪后 15s 内 t 从未前进（>0.5s）则判定源不可播，明确提示换源
        stallWatchdog();
      } else if (msg.type === 'status') {
        setStatus(msg.message);
      } else if (msg.type === 'log') {
        logEvent('server', msg.line);  // 服务端后台日志（ticket-14）
      } else if (msg.type === 'error') {
        currentEl.textContent = '⚠ ' + msg.message;
        currentEl.classList.add('err');
        setStatus('出错', true);
        playStarted = true;  // 解除播放拦截，允许手动看片（无字幕）
      } else if (msg.type === 'end') {
        setStatus('音频处理结束');
        playStarted = true;  // 同上（静默视频等零字幕场景）
        ws.close();
      }
    };
    ws.onerror = () => { logEvent('ws_error', '连接失败'); setStatus('连接失败', true); };
    ws.onclose = () => {
      logEvent('ws_close', '');
      startBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    };
  }

  // 字幕显示节奏：定时快照（250ms，整块替换，不逐字、不逐帧跳动）
  setInterval(syncSubtitle, 250);
  player.addEventListener('seeked', syncSubtitle);
  // 本地文件容器/编码不受浏览器支持（如 .mkv）时 <video> 静默失败成黑屏
  // ticket-16：完整错误入日志（code/message/src/状态），code>0 即停会话（音频+API 停）
  player.addEventListener('error', () => {
    if (!player.error) return;
    const code = player.error.code || 0;
    const emsg = player.error.message || '';
    const esrc = (player.currentSrc || player.src || '').slice(0, 140);
    logEvent('video_error_full',
      `code=${code} msg=${emsg || '(无)'} src=${esrc} ready=${player.readyState} net=${player.networkState}`);
    currentEl.textContent = '⚠ 视频无法播放：'
      + (emsg || `错误码 ${code}（容器/编码不受支持或链接失效）`);
    currentEl.classList.add('err');
    setStatus('视频加载失败', true);
    if (code > 0 && ws) {
      logEvent('video_stop', `会话停止（视频不可播放 code=${code}）`);
      try { ws.close(); } catch (e) {}  // 停音频处理与 API 调用（含 ws 未就绪时中止连接）
    }
  });
  // 视频诊断（ticket-11/16）：stalled/waiting 等不触发 error 的状态也写入会话日志
  ['stalled', 'waiting', 'suspend', 'emptied', 'abort'].forEach((evt) => {
    player.addEventListener(evt, () => {
      const err = player.error ? ` code=${player.error.code}` : '';
      logEvent(`video_${evt}`, `ready=${player.readyState} net=${player.networkState}${err}`);
    });
  });
  player.addEventListener('loadedmetadata', () => {
    logEvent('video_ok', `dur=${(player.duration || 0).toFixed(1)}s`);
  });
  // 播放联动：video 控制画面与进度，audio 跟随出声；暂停时前后端都冻结（真正停止解析）
  player.addEventListener('play', () => {
    if (!playStarted) {
      // 字幕未就绪时手动播放会让视频领先 ASR 一段固定偏移，时间窗永远不匹配
      // → 叠加字幕全程空白（用户 bug）。拦截：暂停，等首条字幕后统一自动播放。
      holdingForSync = true;
      player.pause();
      setStatus('字幕准备中，就绪后自动播放…');
      return;
    }
    holdingForSync = false;
    uiPaused = false;
    audioEl.play().catch(() => {});
    if (ws && ws.readyState === 1) ws.send('resume');
    syncSubtitle();  // 播放起始立即同步（旧 2s 定时器会跳过首段短句）
    logEvent('play', `t=${player.currentTime.toFixed(1)}`);
  });
  player.addEventListener('pause', () => {
    if (holdingForSync) return;  // 拦截产生的 pause，不冻结后端
    uiPaused = true;  // 立即冻结前端显示（丢弃在途 partial）
    audioEl.pause();
    if (ws && ws.readyState === 1) ws.send('pause');
    logEvent('pause', `t=${player.currentTime.toFixed(1)}`);
  });
  player.addEventListener('seeked', () => {
    audioEl.currentTime = player.currentTime;
    if (aligningInitialPlayback) {
      aligningInitialPlayback = false;
      seekPending = false;
      displayedBlock = null;
      logEvent('sync_seeked', `t=${player.currentTime.toFixed(1)}`);
      syncSubtitle();
      return;
    }
    seekPending = true;  // 跳转后清空当前句显示，等新数据（ADR-0001）
    displayedBlock = null;  // 跳转后重新快照（ticket-15）
    currentEl.textContent = '⏳ 跳转中，字幕将随转写跟进…';
    logEvent('seek', `t=${player.currentTime.toFixed(1)}`);
  });

  startBtn.onclick = connect;
  stopBtn.onclick = () => {
    if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }
    if (ws) ws.close();
    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    player.pause();
    audioEl.pause();
    setStatus('已停止');
  };
  uploadBtn.onclick = () => fileEl.click();
  fileEl.addEventListener('change', async () => {
    const f = fileEl.files[0];
    if (!f) { setStatus('未选择文件', true); return; }
    setStatus(`上传 ${f.name}…`);
    logEvent('upload', f.name);
    const fd = new FormData();
    fd.append('file', f);
    try {
      const resp = await fetch('/upload', { method: 'POST', body: fd });
      const data = await resp.json();
      if (resp.ok && data.path) {
        urlEl.value = data.path;
        setStatus(`已上传 ${data.name}，开始识别`);
        connect();
      } else {
        setStatus('上传失败: ' + (data.detail || resp.status), true);
      }
    } catch (e) {
      setStatus('上传失败: ' + e, true);
    }
    fileEl.value = '';
  });
  urlEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
