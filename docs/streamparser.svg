<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="540">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#111133"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="subtitle-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" stroke="#6366f1" stroke-width="0.5"/>
    </pattern>
    <rect width="900" height="540" fill="url(#grid)"/>
  </g>

  <!-- Glowing circle behind camera -->
  <circle cx="100" cy="180" r="60" fill="#6366f1" opacity="0.15" filter="url(#blur)"/>
  <circle cx="100" cy="180" r="35" fill="#6366f1" opacity="0.3" filter="url(#blur)"/>

  <!-- Camera icon -->
  <g transform="translate(65, 145)">
    <rect x="0" y="20" width="70" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <rect x="20" y="18" width="30" height="4" rx="2" fill="#6366f1"/>
    <circle cx="35" cy="42" r="10" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="35" cy="42" r="4" fill="#06b6d4"/>
  </g>

  <!-- Camera label -->
  <text x="100" y="270" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="12">RTSP / RTMP / HLS</text>

  <!-- Arrow from camera to processor -->
  <g stroke="url(#wave)" stroke-width="2" opacity="0.6">
    <line x1="135" y1="180" x2="250" y2="180"/>
    <polygon points="250,175 265,180 250,185" fill="#06b6d4"/>
  </g>

  <!-- Streaming data visual -->
  <g transform="translate(140, 155)">
    <rect x="0" y="0" width="8" height="8" rx="1" fill="#6366f1" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="5" width="8" height="8" rx="1" fill="#06b6d4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="-2" width="8" height="8" rx="1" fill="#6366f1" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="3" width="8" height="8" rx="1" fill="#06b6d4" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="0" width="8" height="8" rx="1" fill="#6366f1" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Central Processor Box -->
  <g transform="translate(260, 120)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#1e1b4b" stroke="url(#glow)" stroke-width="2"/>
    <!-- Inner sections -->
    <rect x="10" y="15" width="55" height="40" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
    <text x="37" y="40" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="9">Demux</text>

    <rect x="72" y="15" width="55" height="40" rx="4" fill="#0f0f23" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="99" y="40" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="9">Decode</text>

    <rect x="134" y="15" width="55" height="40" rx="4" fill="#0f0f23" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
    <text x="161" y="40" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="9">Encode</text>

    <rect x="10" y="65" width="180" height="45" rx="4" fill="#0f0f23" stroke="url(#glow)" stroke-width="1" opacity="0.4"/>
    <text x="100" y="85" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10">字幕滤波器链条</text>
    <text x="100" y="100" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Subtitle Filter Pipeline</text>
  </g>

  <!-- Arrow to ASR cloud -->
  <g stroke="url(#wave)" stroke-width="2" opacity="0.6">
    <line x1="460" y1="160" x2="540" y2="100"/>
    <polygon points="540,95 552,100 540,105" fill="#06b6d4"/>
  </g>

  <!-- ASR Cloud -->
  <g transform="translate(550, 50)">
    <ellipse cx="45" cy="20" rx="55" ry="20" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.5"/>
    <ellipse cx="37" cy="18" rx="45" ry="16" fill="#111133" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <text x="45" y="17" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="9">DashScope</text>
    <text x="45" y="33" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">fun-asr</text>
  </g>

  <!-- Arrow back from ASR -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 3">
    <line x1="550" y1="120" x2="470" y2="200"/>
    <polygon points="470,195 458,200 470,205" fill="#06b6d4"/>
  </g>

  <!-- Arrow to file output -->
  <g stroke="url(#wave)" stroke-width="2" opacity="0.6">
    <line x1="460" y1="200" x2="530" y2="200"/>
    <polygon points="530,195 545,200 530,205" fill="#06b6d4"/>
  </g>

  <!-- Output files -->
  <g transform="translate(550, 170)">
    <rect x="0" y="0" width="150" height="28" rx="5" fill="#0f0f23" stroke="#6366f1" stroke-width="1"/>
    <text x="10" y="18" fill="#6366f1" font-family="monospace" font-size="11">🎬 stream_001.mp4</text>

    <rect x="0" y="38" width="150" height="28" rx="5" fill="#0f0f23" stroke="#06b6d4" stroke-width="1"/>
    <text x="10" y="56" fill="#06b6d4" font-family="monospace" font-size="11">📝 stream_001.srt</text>
  </g>

  <!-- Subtitle preview panel at bottom -->
  <rect x="60" y="360" width="780" height="160" rx="0" fill="url(#subtitle-bg)"/>
  <rect x="60" y="360" width="780" height="160" rx="0" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- Simulated video frame content -->
  <g opacity="0.08">
    <rect x="180" y="380" width="80" height="60" rx="4" fill="#6366f1"/>
    <circle cx="300" cy="400" r="30" fill="#06b6d4"/>
    <rect x="360" y="385" width="120" height="50" rx="4" fill="#6366f1"/>
    <circle cx="560" cy="410" r="25" fill="#06b6d4"/>
    <rect x="620" y="390" width="90" height="40" rx="4" fill="#6366f1"/>
  </g>

  <!-- Subtitle text on frame -->
  <text x="450" y="480" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">今天天气真不错，适合出去走走。</text>
  <text x="450" y="500" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">实时语音识别 · 字幕自动生成 · 直播场景</text>

  <!-- Title -->
  <text x="450" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="2">streamparser</text>
  <text x="450" y="78" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13">High-Performance Stream Processing + Real-Time ASR Subtitle</text>

  <!-- Left side label -->
  <text x="30" y="350" fill="#6366f1" font-family="monospace" font-size="10" opacity="0.6">▸ SOURCE</text>
  <text x="280" y="350" fill="#06b6d4" font-family="monospace" font-size="10" opacity="0.6">▸ PROCESS</text>
  <text x="610" y="350" fill="#64748b" font-family="monospace" font-size="10" opacity="0.6">▸ OUTPUT</text>

  <!-- Decorative corner elements -->
  <rect x="2" y="2" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <rect x="4" y="4" width="26" height="26" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>

  <rect x="868" y="2" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <rect x="870" y="4" width="26" height="26" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>

  <rect x="2" y="508" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <rect x="4" y="510" width="26" height="26" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>

  <rect x="868" y="508" width="30" height="30" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <rect x="870" y="510" width="26" height="26" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
</svg>
