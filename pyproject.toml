[project]
name = "streamparser"
version = "0.1.0"
description = "A high-performance stream media processing and parsing toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "WangHao", email = "1046911101@qq.com" }]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "av>=14.0.1",
    "concurrent-log-handler>=0.9.25",
    "dashscope>=1.25.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.12",
    "yt-dlp>=2024.10.7",
    "uvicorn[standard]>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["streamparser"]
include = ["pyproject.toml", "requirements.txt", "README.md", "LICENSE"]
exclude = ["**/__pycache__"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
testpaths = ["tests/python"]
pythonpath = [".", "tools", "tests/acceptance", "tests/browser"]
