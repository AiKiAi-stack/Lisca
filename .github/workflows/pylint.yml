name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pylint pytest playwright
    - name: Analysing the code with pylint
      run: |
        # 只查 error 级；E0611/E1101 为 av/cv2 等 C 扩展库的静态分析误报，
        # E0110 为 test_engines 故意实例化抽象类断言 TypeError
        # init-hook 包含运行时和验收工具的导入路径
        # whisper_streaming 为 vendored 上游，不归本仓库 lint
        # DashScope 2.0.3 的 ASR 路径为动态别名；先验证实际符号，再跳过该别名的静态路径查找。
        python -c "from dashscope.audio.asr import Recognition, RecognitionCallback, RecognitionResult"
        pylint --errors-only --init-hook="import sys; sys.path[:0] = ['whisper_streaming', 'tools', 'tests/acceptance', 'tests/browser', 'tests/python']" \
          --ignored-modules=dashscope.audio.asr \
          --disable=E0611,E1101,E0110 $(git ls-files '*.py' | grep -v '^whisper_streaming/')
