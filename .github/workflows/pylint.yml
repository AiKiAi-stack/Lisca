name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pylint pytest
    - name: Analysing the code with pylint
      run: |
        # 只查 error 级；E0611/E1101 为 av/cv2 等 C 扩展库的静态分析误报，
        # E0110 为 test_engines 故意实例化抽象类断言 TypeError
        # init-hook 让 pylint 认识运行时 sys.path（tools/ 与 vendored whisper_streaming）
        # whisper_streaming 为 vendored 上游，不归本仓库 lint
        pylint --errors-only --init-hook="import sys; sys.path.insert(0,'whisper_streaming'); sys.path.insert(0,'tools')" \
          --disable=E0611,E1101,E0110 $(git ls-files '*.py' | grep -v '^whisper_streaming/')
