name: Release binaries

on:
  pull_request:
    paths: ['tools/release/**', '.github/workflows/release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.1.0
        type: string
      publish:
        description: Upload verified binaries to the existing release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r source/requirements-webui.txt concurrent-log-handler pyinstaller==6.22.3
      - name: Build portable archive
        run: python packaging/tools/release/build.py --source source --output dist
      - name: Check extracted executable
        shell: bash
        run: |
          for archive in dist/*; do
            python packaging/tools/release/check_binary.py "$archive"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lisca-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Lisca-*
          path: dist
          merge-multiple: true
      - name: Upload checked binaries
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
