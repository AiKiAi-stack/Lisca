name: Release binaries

on:
  pull_request:
    paths: ['tools/release/**', '.github/workflows/release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.1.0
        type: string
      publish:
        description: Upload verified binaries to the existing release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            python_arch: x64
          - os: windows-11-arm
            platform: windows-arm64
            python_arch: arm64
          - os: ubuntu-22.04
            platform: linux-x64
            python_arch: x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            python_arch: arm64
          - os: macos-15-intel
            platform: macos-x64
            python_arch: x64
          - os: macos-15
            platform: macos-arm64
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install build dependencies
        run: python -m pip install --only-binary=:all: -r source/requirements-webui.txt concurrent-log-handler pyinstaller==6.22.3
      - name: Build portable archive
        run: python packaging/tools/release/build.py --source source --output dist
      - name: Check extracted executable
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          for archive in dist/*; do
            python packaging/tools/release/check_binary.py "$archive" --platform "$TARGET_PLATFORM"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lisca-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Lisca-*
          path: dist
          merge-multiple: true
      - name: Upload checked binaries
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(Path('dist').glob('Lisca-*'))
          assert len(files) == 8, [path.name for path in files]
          lines = []
          for path in files:
              with path.open('rb') as binary:
                  digest = hashlib.file_digest(binary, 'sha256').hexdigest()
              lines.append(f'{digest}  {path.name}\n')
          Path('dist/SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY
          gh release upload "$RELEASE_TAG" dist/* --clobber
