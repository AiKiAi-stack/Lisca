# ASR 实时字幕配置文件
# Lisca 识别客户端配置示例；参见 lisca/asr/asr_config.py。

provider: dashscope

# API Key: 通过环境变量 DASHSCOPE_API_KEY 获取，或直接填写
api_key: ${DASHSCOPE_API_KEY}

# 业务空间ID (华北2北京地域需要)
workspace_id: ""

# 地域: cn-beijing 或 ap-southeast-1
region: cn-beijing

# 模型: fun-asr-realtime
model: fun-asr-realtime

# 重连配置
reconnect:
  max_retries: 10       # 最大重试次数
  base_delay: 1.0       # 首次重连等待(秒)
  max_delay: 30.0        # 最大等待(秒)，指数退避上限

# 字幕渲染配置
subtitle:
  # 字体路径，留空则自动探测系统 CJK 字体
  font_path: ""
  font_size: 32
  max_lines: 2           # 最多同时显示行数
  position: bottom        # bottom | top
  offset_y: 20            # 距边缘偏移(像素)
  text_color: [255, 255, 255]    # RGB
  stroke_color: [0, 0, 0]       # 描边颜色 RGB
  stroke_width: 2                # 描边宽度(像素)
